name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - name: Main test suite
        run: npm test
      - name: Verifier test suite
        run: npm run test:verifier

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t aegis:ci .
      - name: Smoke test (demo mode, health check)
        run: |
          docker run -d --name aegis -p 8787:8787 -e AEGIS_DEMO_MODE=true aegis:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8787/healthz && exit 0
            sleep 1
          done
          docker logs aegis
          exit 1
